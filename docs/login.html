<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — InventoryPro</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: linear-gradient(135deg,#0D47A1,#1A73E8);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            overflow: hidden;
            box-shadow: 0 24px 64px rgba(0,0,0,0.3);
        }

        .login-header {
            background: linear-gradient(135deg,#0D47A1,#1A73E8);
            padding: 32px 24px;
            text-align: center;
            color: white;
        }

        .login-body {
            padding: 32px 24px;
        }

        .logo-big {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0 auto 12px;
            border: 2px solid rgba(255,255,255,0.4);
        }

        .demo-box {
            background: #F8F9FC;
            border-radius: 10px;
            padding: 14px;
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--gray);
        }

            .demo-box strong {
                color: var(--dark);
            }

        code {
            background: #E8F0FE;
            color: var(--primary);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="login-card">

        <!-- Header -->
        <div class="login-header">
            <div class="logo-big">IP</div>
            <h2 style="margin-bottom:4px;">InventoryPro</h2>
            <p style="opacity:0.85; font-size:0.9rem;">
                Durban Small Business Supplies
            </p>
        </div>

        <!-- Form -->
        <div class="login-body">
            <h3 style="margin-bottom:6px;">Sign In</h3>
            <p style="color:var(--gray); font-size:0.9rem; margin-bottom:24px;">
                Enter your credentials to continue
            </p>

            <!-- Error alert -->
            <div id="loginError" class="alert alert-warning"
                 style="display:none; margin-bottom:16px;"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control"
                           placeholder="your@email.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control"
                           placeholder="Enter your password"
                           autocomplete="current-password">
                </div>
                <div style="text-align:right; margin-top:-8px; margin-bottom:20px;">
                    <a href="#" style="color:var(--primary); font-size:0.85rem;
                   text-decoration:none;">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-blue" style="width:100%;">
                    Sign In
                </button>
            </form>

            <!-- Divider -->
            <div style="display:flex; align-items:center; gap:12px; margin:20px 0;">
                <div style="flex:1; height:1px; background:var(--border);"></div>
                <span style="color:var(--gray); font-size:0.85rem;">or</span>
                <div style="flex:1; height:1px; background:var(--border);"></div>
            </div>

            <!-- Google -->
            <button class="btn" style="width:100%; background:white; border:1.5px solid
                var(--border); color:var(--dark); display:flex; align-items:center;
                justify-content:center; gap:10px;"
                    onclick="alert('Google Sign-In available on the Android app')">
                <svg width="18" height="18" viewBox="0 0 18 18">
                    <path fill="#4285F4"
                          d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209
                      1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567
                      2.684-3.875 2.684-6.615z" />
                    <path fill="#34A853"
                          d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344
                      0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" />
                    <path fill="#FBBC05"
                          d="M3.964 10.712A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.712V4.956H.957A8.996
                      8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.044l3.007-2.332z" />
                    <path fill="#EA4335"
                          d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891
                      11.426 0 9 0A8.997 8.997 0 0 0 .957 4.956L3.964 7.288C4.672
                      5.163 6.656 3.58 9 3.58z" />
                </svg>
                Sign in with Google
            </button>

            <!-- Register link -->
            <p style="text-align:center; margin-top:20px; font-size:0.9rem;
                  color:var(--gray);">
                Don't have an account?
                <a href="#" style="color:var(--primary); font-weight:600;
               text-decoration:none;">Register</a>
            </p>

            <!-- Demo credentials -->
            <div class="demo-box">
                <strong>Demo Credentials:</strong><br><br>
                🔵 Manager: <code>lefa@inventorypro.com</code>
                / <code>Manager@123</code><br><br>
                🟢 Assistant: <code>kago@inventorypro.com</code>
                / <code>Shop123</code>
            </div>
        </div>

    </div>

    <p style="color:rgba(255,255,255,0.5); font-size:0.8rem; margin-top:20px;">
        © 2025 InventoryPro — CodeCrafters
    </p>

    <script src="js/main.js"></script>
</body>
</html>
